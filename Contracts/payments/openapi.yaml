openapi: 3.1.0
info:
  title: Payments
  version: 1.0.0
  description: |
    Contrato entre o app e o backend de pagamentos. `MockPaymentHTTPServer` o implementa em memória;
    um backend real que o cumpra substitui o mock sem mudanças no app. `Tests/PaymentsContractTests`
    verifica os dois lados.

    Regras de idempotência:

    - Cada chave identifica uma intenção de pagamento. O servidor reserva a chave antes de processar,
      com garantia de unicidade (por exemplo, uma constraint única).
    - Débito e registro do resultado acontecem na mesma transação. Não existe estado em que o dinheiro
      moveu e a chave ficou sem resultado.
    - Mesma chave e mesmo corpo depois de concluída: o servidor devolve o mesmo status e o mesmo corpo,
      com `Idempotent-Replayed: true`, sem processar de novo. Vale para sucesso (201) e para recusa (402).
    - Mesma chave com outro corpo: 422. A comparação usa todos os campos do corpo.
    - Mesma chave enquanto a primeira ainda processa: 409.
    - Erros de validação (400) não reservam nem guardam a chave.
    - Uma reserva sem resultado expira após o prazo de processamento (30 s). Depois disso a tentativa é
      considerada abandonada e a chave pode ser processada de novo. Só o dono da reserva pode gravar o
      resultado; uma execução cuja reserva expirou não debita.
    - O resultado de uma chave concluída é guardado por 24 h. Depois disso o servidor descarta o resultado,
      mas continua lembrando que a chave existiu: GET e POST com ela respondem 410. A mesma chave nunca
      representa um pagamento novo.
    - 404 na consulta significa que nada foi debitado com a chave (nunca chegou ou a reserva expirou sem
      resultado). É o único caso em que reenviar com a mesma chave é seguro.
servers:
  - url: https://api.exemplo.com/v1
paths:
  /payments:
    post:
      operationId: createPayment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      responses:
        "201":
          description: Pagamento criado, ou a repetição de uma criação anterior com a mesma chave.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: "Cabeçalho ausente ou corpo inválido (`missing_idempotency_key`, `invalid_body`). Não guardado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: "Recusa definitiva (`amount_exceeds_limit`). Guardada e repetida para a mesma chave."
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Outra request com a mesma chave ainda está em processamento (`request_in_progress`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "A chave já foi usada com outro corpo (`idempotency_key_reused`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: |
            A chave passou do prazo de retenção (`idempotency_key_expired`). O servidor não processa de novo
            nem informa o resultado anterior. Para o cliente, o resultado continua desconhecido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Erro interno. O cliente não sabe se houve débito e deve consultar a tentativa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /payment-attempts/{idempotencyKey}:
    get:
      operationId: getPaymentAttempt
      description: Estado da tentativa associada à chave. Usado na recuperação depois de um resultado desconhecido.
      parameters:
        - name: idempotencyKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        "200":
          description: A chave é conhecida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAttempt"
        "404":
          description: |
            Nenhuma tentativa com essa chave (`not_found`): a request nunca chegou ou foi abandonada (reserva
            expirada sem resultado). Nada foi debitado, então um POST com a mesma chave é seguro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: |
            A chave existiu, mas passou do prazo de retenção (`idempotency_key_expired`). O resultado foi
            descartado: o pagamento pode ter sido concluído. Reenviar não é seguro, e um POST com a mesma
            chave também responde 410.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
  headers:
    IdempotentReplayed:
      description: "`true` quando a resposta é a repetição de um resultado guardado."
      schema:
        type: string
        enum: ["true"]
  schemas:
    PaymentRequest:
      type: object
      required: [cents, destinationAccountID]
      additionalProperties: false
      properties:
        cents:
          type: integer
          minimum: 1
        destinationAccountID:
          type: string
          minLength: 1
    Payment:
      type: object
      required: [id, cents, destinationAccountID]
      properties:
        id:
          type: string
        cents:
          type: integer
        destinationAccountID:
          type: string
    PaymentAttempt:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [processing, succeeded, declined]
        payment:
          $ref: "#/components/schemas/Payment"
          description: Presente quando `status` é `succeeded`.
        error:
          $ref: "#/components/schemas/ErrorDetail"
          description: Presente quando `status` é `declined`.
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
