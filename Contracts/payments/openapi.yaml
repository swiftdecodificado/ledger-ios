openapi: 3.1.0

info:
  title: Payments
  version: 1.0.0
  description: |
    Contract between the app and the payment backend.

    `MockPaymentHTTPServer` provides an in-memory implementation of this contract.
    A real backend can replace the mock without requiring changes in the app, as long as
    it follows the same behavior.

    `PaymentsContractTests` validates both implementations.

    Idempotency rules:

    - Each idempotency key identifies one payment intent.
    - The server reserves the key before processing, using a uniqueness guarantee such
      as a database unique constraint.
    - The financial effect and the stored result are committed atomically.
      There must not be a state where money was moved but the key has no stored result.
    - Reusing the same key with the same request after completion returns the same status
      and response body with `Idempotent-Replayed: true`.
      This applies to successful payments (201) and declined payments (402).
    - Reusing the same key with a different request returns 422.
      The comparison uses the complete request body.
    - Reusing the same key while the first request is still processing returns 409.
    - Validation errors (400) do not reserve or store the key.
    - A reservation without a result expires after 30 seconds.
      After that, the attempt is considered abandoned and the key may be processed again.
    - Only the owner of the active reservation may commit the result.
      A slow execution that lost its reservation must not create a financial effect.
    - Completed results are kept for 24 hours.
    - After the result expires, the server keeps a tombstone for the key for 30 days.
      During this period, GET and POST requests with the same key return 410.
    - A 404 response from the lookup endpoint means no financial effect exists for that key.
      This is the only case where retrying the POST with the same key is safe.

servers:
  - url: http://localhost:8080/v1
    description: Local LedgerCore
    
security: []

paths:
  /payments:
    post:
      summary: Create a payment
      operationId: createPayment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      responses:
        "201":
          description: |
            Payment created successfully, or a replay of a previous successful request
            using the same idempotency key and request body.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

        "400":
          description: |
            Invalid request, such as a missing idempotency key or invalid request body.
            The key is not reserved or stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "402":
          description: |
            The payment was declined. The result is stored and returned again when the
            same key is replayed with the same request.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "409":
          description: |
            Another request using the same idempotency key is still being processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "410":
          description: |
            The idempotency key is known, but its stored result has expired.
            The server does not process the payment again and cannot return the previous result.
            The client must treat the payment outcome as unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "422":
          description: |
            The idempotency key was already used with a different request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "500":
          description: |
            Internal server error.
            The client cannot know if a financial effect happened and should check
            the payment attempt status before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /payment-attempts/{idempotencyKey}:
    get:
      summary: Get payment attempt status
      operationId: getPaymentAttempt
      description: |
        Returns the current state of the payment attempt linked to the idempotency key.
        This endpoint is used to recover after an unknown payment result.
      parameters:
        - name: idempotencyKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        "200":
          description: The idempotency key is known.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAttempt"

        "404":
          description: |
            No payment attempt exists for this key.
            The original request either never reached the server or its reservation expired
            before any financial effect was committed.

            No debit exists for this key, so retrying the POST with the same key is safe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "410":
          description: |
            The key existed, but its result is no longer available because the retention
            period expired.

            The original payment may have completed successfully.
            Retrying is not safe, and POST requests using the same key also return 410.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255

  headers:
    IdempotentReplayed:
      description: |
        Present with value `true` when the response is a replay of a previously stored result.
      schema:
        type: string
        enum:
          - "true"

  schemas:
    PaymentRequest:
      type: object
      additionalProperties: false
      required:
        - cents
        - destinationAccountID
      properties:
        cents:
          type: integer
          minimum: 1
        destinationAccountID:
          type: string
          minLength: 1

    Payment:
      type: object
      additionalProperties: false
      required:
        - id
        - cents
        - destinationAccountID
      properties:
        id:
          type: string
        cents:
          type: integer
          minimum: 1
        destinationAccountID:
          type: string
          minLength: 1

    PaymentAttempt:
      oneOf:
        - $ref: "#/components/schemas/ProcessingPaymentAttempt"
        - $ref: "#/components/schemas/SucceededPaymentAttempt"
        - $ref: "#/components/schemas/DeclinedPaymentAttempt"
      discriminator:
        propertyName: status
        mapping:
          processing: "#/components/schemas/ProcessingPaymentAttempt"
          succeeded: "#/components/schemas/SucceededPaymentAttempt"
          declined: "#/components/schemas/DeclinedPaymentAttempt"

    ProcessingPaymentAttempt:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: processing

    SucceededPaymentAttempt:
      type: object
      additionalProperties: false
      required:
        - status
        - payment
      properties:
        status:
          type: string
          const: succeeded
        payment:
          $ref: "#/components/schemas/Payment"

    DeclinedPaymentAttempt:
      type: object
      additionalProperties: false
      required:
        - status
        - error
      properties:
        status:
          type: string
          const: declined
        error:
          $ref: "#/components/schemas/ErrorDetail"

    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
